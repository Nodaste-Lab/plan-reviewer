<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui,sans-serif;width:1636px}
#plan-navbar{position:relative;top:0;z-index:30;min-height:86px;box-sizing:border-box;display:grid;grid-template-rows:auto auto;gap:8px;padding:10px 16px;border-bottom:1px solid #2b364d;background:#0f172a}
#plan-navbar-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
#plan-navbar a{color:#7dd3fc;text-decoration:none;font-weight:700}
#plan-navbar .doc-kind-switcher{display:inline-flex;gap:2px;padding:3px;border:1px solid #334155;border-radius:999px;background:#08111f;margin-right:auto}
#plan-navbar .doc-kind-seg{border-radius:999px;padding:5px 10px;color:#a7b0c0;font-size:12px;font-weight:850;text-decoration:none;white-space:nowrap}
#plan-navbar .doc-kind-seg.active{background:#0ea5e9;color:#e0f2fe}
#plan-navbar button,#plan-navbar .tool-button{background:#1e293b;color:#e5e7eb;border:1px solid #475569;border-radius:6px;padding:8px 10px;cursor:pointer}
#plan-navbar .tool-button{display:inline-flex;align-items:center;justify-content:center;min-width:38px;min-height:34px;box-sizing:border-box;line-height:1}
.download-tool{border-color:rgba(56,189,248,.72)!important;background:#075985!important;color:#ecfeff!important}.pin-button{border-color:#facc15!important;color:#fef08a!important}
#current-plan-bar{display:flex;align-items:center;gap:8px;min-width:0;border-top:1px solid rgba(71,85,105,.55);padding-top:8px;color:#cbd5e1}
#current-plan-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f8fafc}
.ready-pill{white-space:nowrap}
.comments-count{min-width:18px;height:18px;border-radius:999px;background:#7e22ce;color:white;display:inline-grid;place-items:center;padding:0 5px;font-size:11px;font-weight:900}
.current-plan-status-control{display:inline-flex;align-items:center;gap:6px;margin-left:auto;color:#cbd5e1;font-size:12px;font-weight:850}.current-plan-status-control select{background:#020617;color:#e5e7eb;border:1px solid #7dd3fc;border-radius:6px;padding:6px 8px}.current-plan-status-error{display:none}
.comment-status-banner{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;border:1px solid #475569;background:#1e293b;color:#cbd5e1;white-space:nowrap}.comment-status-banner.green{border-color:rgba(34,197,94,.7);background:rgba(22,101,52,.55);color:#dcfce7}.comment-status-banner.yellow{border-color:rgba(234,179,8,.7);background:rgba(120,53,15,.55);color:#fde68a}
.lifecycle-pill{display:inline-flex;align-items:center;justify-content:center;min-height:34px;box-sizing:border-box;border:1px solid #64748b;border-radius:999px;background:#111827;color:#e2e8f0;padding:6px 12px;font-size:12px;font-weight:900;line-height:1;white-space:nowrap}.lifecycle-pill.archived{border-color:#94a3b8;background:#182033;color:#f1f5f9}.lifecycle-pill.deferred{border-color:#f59e0b;background:rgba(120,53,15,.55);color:#fde68a}.lifecycle-help{border:1px solid #475569;border-radius:999px;background:#111827;color:#cbd5e1;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
#restore-plan,#resume-plan{border-color:#22c55e!important;color:#bbf7d0!important}#plan-navbar [hidden]{display:none!important}
</style></head><body><nav id="plan-navbar" aria-label="Plan actions"><div id="plan-navbar-actions"><button id="desktop-plan-nav-toggle" class="tool-button" type="button" aria-label="Plan Navigator" title="Plan Navigator">☰</button><nav class="doc-kind-switcher" aria-label="Document view selector"><a class="doc-kind-seg" href="/">Kanban</a><a class="doc-kind-seg" href="/?view=all">All documents</a></nav><button id="pin-plan" class="pin-button" type="button" aria-label="Pin plan" title="Pin plan">☆</button><a id="download-raw-plan" class="tool-button download-tool" aria-label="Download raw plan" title="Download raw plan HTML; ZIP includes required assets.">⬇</a><button id="request-execution-review" class="tool-button" type="button" aria-label="Request execution-ready review" title="Request execution-ready review">✓</button><button id="build-plan" class="tool-button" type="button" aria-label="Build Plan" title="Build Plan">⚒</button><span id="archive-status" class="lifecycle-pill archived" role="status" aria-label="Status: Archived">Status: Archived</span><button id="restore-plan" class="tool-button" type="button" aria-label="Restore plan" title="Restore plan">↩ Restore</button><a id="configuration-link" class="tool-button" aria-label="Configuration" title="Configuration">⚙</a><button id="desktop-comments-toggle" class="tool-button comments-toggle" type="button" aria-label="Open comments" title="Comments">💬 <span class="comments-count">5</span></button></div><div id="current-plan-bar"><strong id="current-plan-title">Good Morning — 2026-06-24</strong><span class="ready-pill not-ready">Execution not ready</span><span class="lifecycle-help">Restore this plan before changing its board status.</span><span class="comment-status-banner green">All resolved</span></div></nav></body></html>
